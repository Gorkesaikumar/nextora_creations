[build]
  command = "npm run build"
  publish = "dist"

# Force HTTPS & Non-WWW Primary Domain Redirect
[[redirects]]
  from = "https://www.nextoracreations.co.in/*"
  to = "https://nextoracreations.co.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.nextoracreations.co.in/*"
  to = "https://nextoracreations.co.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://nextoracreations.co.in/*"
  to = "https://nextoracreations.co.in/:splat"
  status = 301
  force = true

# SPA / Fallback Redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enterprise Security Headers for All Routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://script.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://script.google.com; frame-ancestors 'none'; base-uri 'self';"

# Immutable Long-Term Caching for Build Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

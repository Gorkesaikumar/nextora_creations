services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nextora
      POSTGRES_PASSWORD: nextora-local-only
      POSTGRES_DB: nextora
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - nextora-internship-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextora -d nextora"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  nextora-internship-db:

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Nextora Creations</title>
    <meta name="description" content="The requested page could not be found on Nextora Creations.">
    <link rel="icon" type="image/webp" href="/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@800;900&family=JetBrains+Mono:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2.5rem 1.5rem;
            border: 1px solid #ECECEC;
            background: #FAFAFA;
        }
        .code {
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 6rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            color: #111111;
            letter-spacing: -0.05em;
        }
        h1 {
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            margin-top: 1rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }
        p {
            color: #6B7280;
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            background-color: #111111;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            text-decoration: none;
            padding: 1rem 2rem;
            text-transform: uppercase;
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }
        a:hover, a:focus-visible {
            background-color: #00AEEF;
            color: #111111;
            outline: 2px solid #00AEEF;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for does not exist or has been relocated.</p>
        <a href="/">Return To Nextora Home</a>
    </main>
</body>
</html>
